name: Guest Posting Pipeline

on:
  schedule:
    # 4:00 AM UTC = 9:30 AM IST, every day
    - cron: '0 4 * * *'
  workflow_dispatch:   # allows manual trigger from GitHub Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit targets.json back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPER_API_KEY:    ${{ secrets.SERPER_API_KEY }}
          SENDER_EMAIL:      ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD:    ${{ secrets.EMAIL_PASSWORD }}
        run: python pipeline.py

      - name: Commit updated targets.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add targets.json
          git diff --staged --quiet || git commit -m "chore: update targets [skip ci]"
          git push
